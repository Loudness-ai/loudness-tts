<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loudness-tts browser test</title>
<script type="importmap">{"imports": {"#ort": "/node_modules/onnxruntime-web/dist/ort.wasm.bundle.min.mjs"}}</script>
<style>body{font:16px system-ui;margin:24px;max-width:720px}pre{white-space:pre-wrap;background:#f4f4f4;padding:12px}</style>
</head>
<body>
<h1>loudness-tts in the browser</h1>
<p id="status">Loading…</p>
<audio id="player" controls></audio>
<pre id="out"></pre>
<script type="module">
import { synthesize, configure, version, findVoice } from "/dist/index.js";
const status = document.getElementById("status");
const out = document.getElementById("out");
// No parameters: everything from this server. ?cdn: the browser defaults (jsDelivr); ?cdn&espeak=URL: the defaults
// with espeak-ng's data from URL (to try a commit before its release tag exists).
const query = new URLSearchParams(location.search);
if (query.has("cdn")) configure(query.get("espeak") ? { espeakDataUrl: query.get("espeak") } : {});
else configure({ espeakDataUrl: "/espeak-ng-data/", onnxWasmUrl: "/node_modules/onnxruntime-web/dist/" });
try {
  const voice = findVoice("auto", "en-US", true);
  status.textContent = `loudness-tts ${version}: loading ${voice.id}… (isolated: ${crossOriginIsolated})`;
  const t0 = performance.now();
  const first = await synthesize("Dr. Smith paid $5.50 on 4/5/2026. Call +1 555-123-4567, please.", {
    voice: voice.id });
  const t1 = performance.now();
  const second = await synthesize("The meeting starts on Monday morning, so please arrive a few minutes early.");
  const t2 = performance.now();
  document.getElementById("player").src = URL.createObjectURL(first.blob());
  const words = first.timings.words.map(([a, b, s]) => `${first.text.slice(a, b)}@${s}`).join(" ");
  window.__result = { ok: true, voice: first.voice.id, duration: first.duration, firstMs: Math.round(t1 - t0),
    secondMs: Math.round(t2 - t1), secondRtf: second.metrics.realTimeFactor, spoken: first.spoken,
    timings: first.metrics.timings, isolated: crossOriginIsolated, words, srt: first.srt() };
  status.textContent = "Done.";
  out.textContent = JSON.stringify(window.__result, null, 1);
} catch (error) {
  window.__result = { ok: false, error: String(error), code: error.code, stack: error.stack };
  status.textContent = "Failed: " + error;
  out.textContent = error.stack;
}
</script>
</body>
</html>
