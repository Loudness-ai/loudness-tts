[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-tts"
dynamic = ["version"]
description = "Fast, natural text to speech on your own computer or server: 1,683 ranked Piper voices, smart text reading, subtitles, loudness normalization and an OpenAI-compatible server. No API key."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-APACHE", "NOTICE"]
authors = [{ name = "Asad Shehzad", email = "asad@loudness.ai" }]
maintainers = [{ name = "Loudness.ai", email = "asad@loudness.ai" }]
requires-python = ">=3.9"
dependencies = ["piper-tts>=1.8,<2", "numpy>=1.22"]
keywords = ["tts", "text-to-speech", "piper", "piper-tts", "offline-tts", "local-tts", "speech-synthesis", "openai-compatible", "subtitles", "srt", "vtt", "lufs", "voice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries",
    "Environment :: Console",
]

[project.optional-dependencies]
timings = ["onnx>=1.15"]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://loudness.ai/developers/"
Source = "https://github.com/Loudness-ai/local-tts"
Issues = "https://github.com/Loudness-ai/local-tts/issues"
Documentation = "https://github.com/Loudness-ai/local-tts#readme"
"Voice ranking" = "https://loudness.ai/research/piper-tts-voices-ranked/"
"Online Text to Speech" = "https://loudness.ai/tools/text-to-speech/"

[project.scripts]
local-tts = "local_tts.cli:main"

[tool.setuptools.dynamic]
version = { attr = "local_tts._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_tts = ["data/*.json", "py.typed"]
