name: Release
on:
  push: {tags: ["v*"]}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build twine && python -m build python && twine check python/dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: python/dist/}
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}   # PyPI trusted publishing: no token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/loudness-ai/loudness-tts:${{ github.ref_name }},ghcr.io/loudness-ai/loudness-tts:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Loudness-ai/loudness-tts
            org.opencontainers.image.description=Natural text to speech on your own server, OpenAI-compatible
            org.opencontainers.image.licenses=GPL-3.0-or-later
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions: {contents: read, id-token: write}   # npm trusted publishing with provenance: no token stored
    defaults: {run: {working-directory: javascript}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", registry-url: "https://registry.npmjs.org"}
      - run: npm ci && node scripts/espeak-data.mjs && npm run build && npm test
      - run: npm publish --provenance --access public
  github-release:
    needs: [pypi, docker, npm]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: softprops/action-gh-release@v2
        with: {files: "dist/*", generate_release_notes: true}
