name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: python}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
  synthesis:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: python}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,timings]"
      - run: loudness-tts download en_US-clean100-medium -q
      - run: pytest -q
      - run: loudness-tts doctor --synthesize
  javascript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "24"]
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: javascript}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}", cache: npm, cache-dependency-path: javascript/package-lock.json}
      - run: npm ci
      - run: node scripts/espeak-data.mjs    # espeak-ng data from piper-tts 1.8.0, checked against MANIFEST.json
      - run: npm run build
      - run: npm test
  javascript-synthesis:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: javascript}}
    env: {LOUDNESS_TTS_HOME: "${{ github.workspace }}/voices"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: javascript/package-lock.json}
      - run: npm ci && node scripts/espeak-data.mjs && npm run build
      - run: node dist/cli.js download en_US-clean100-medium en_IE-jenny-medium -q
      - run: npm test
      - run: node dist/cli.js doctor --synthesize
      - uses: oven-sh/setup-bun@v2
      - run: bun test/smoke.mjs
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: deno run -A test/smoke.mjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build && python -m build --wheel --outdir dist python
      - run: docker build -f docker/Dockerfile -t loudness-tts:ci .
      - run: |
          docker run -d --name tts -p 8880:8880 loudness-tts:ci --no-preload
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8880/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8880/v1/models | grep -q tts-1
          docker logs tts
